[pytest]
# Default command-line arguments: verbose output, clean traceback
addopts = -v --tb=short

# Directories to search for tests
testpaths = tests

# Enable console log display
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
